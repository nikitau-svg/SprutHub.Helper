name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint, test and build
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare downloadable APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SprutHub.Helper.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SprutHub.Helper-debug-apk
          path: SprutHub.Helper.apk
          if-no-files-found: error
          retention-days: 30
