name: Android CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Lint, test and build debug APK
        run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare beta APK and checksum
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        shell: bash
        run: |
          mkdir -p dist
          short_sha="${GITHUB_SHA::7}"
          apk="SprutHub.Helper-beta-${short_sha}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/$apk"
          cd dist
          sha256sum "$apk" > "$apk.sha256"

      - name: Upload beta APK
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@v4
        with:
          name: SprutHub.Helper-beta-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
