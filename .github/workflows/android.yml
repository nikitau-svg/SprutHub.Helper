name: Android CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_SIGNING_STORE_FILE: ${{ github.workspace }}/.signing/spruthub-helper.p12
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit public tree and documentation links
        run: ./scripts/check-public-tree.sh

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Restore stable APK signing key
        if: github.event_name != 'pull_request'
        env:
          ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        shell: bash
        run: |
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          mkdir -p .signing
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$ANDROID_SIGNING_STORE_FILE"
          chmod 600 "$ANDROID_SIGNING_STORE_FILE"

      - name: Test Telegram release notifier
        run: python3 .github/scripts/test_notify_telegram_release.py

      - name: Lint, test and build release APK, Play bundle and screenshot APK
        run: ./gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleScreenshot :app:assembleRelease :app:bundleRelease

      - name: Verify screenshot APK isolation
        run: bash scripts/check-screenshot-build.sh

      - name: Prepare beta APK, Play bundle and checksums
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        shell: bash
        run: |
          mkdir -p dist
          short_sha="${GITHUB_SHA::7}"
          apk="SprutHub.Helper-beta-${short_sha}.apk"
          bundle="SprutHub.Helper-beta-${short_sha}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/$apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/$bundle"
          cp LICENSE NOTICE dist/
          cd dist
          sha256sum "$apk" > "$apk.sha256"
          sha256sum "$bundle" > "$bundle.sha256"

      - name: Verify beta APK and Play bundle signatures
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        shell: bash
        run: |
          apk="$(find dist -maxdepth 1 -name '*.apk' -print -quit)"
          bundle="$(find dist -maxdepth 1 -name '*.aab' -print -quit)"
          test -n "$apk"
          test -n "$bundle"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          jarsigner -verify "$bundle"

      - name: Upload beta APK and Play bundle
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/beta'
        uses: actions/upload-artifact@v4
        with:
          name: SprutHub.Helper-beta-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
