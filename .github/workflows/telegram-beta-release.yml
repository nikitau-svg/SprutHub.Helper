name: Telegram beta release

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - .github/telegram-beta-retry.txt
  workflow_dispatch:
    inputs:
      tag:
        description: Published beta tag to announce
        required: true
        type: string
      dry_run:
        description: Build and validate the message without sending it
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-beta-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, '-beta.'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout notification script
        uses: actions/checkout@v5

      - name: Resolve requested retry tag
        if: github.event_name == 'push'
        run: |
          retry_tag="$(sed -n '1p' .github/telegram-beta-retry.txt | tr -d '[:space:]')"
          if ! printf '%s' "$retry_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$'; then
            echo "::error::Invalid beta tag in .github/telegram-beta-retry.txt"
            exit 1
          fi
          echo "RELEASE_TAG=$retry_tag" >> "$GITHUB_ENV"

      - name: Verify published assets and notify Telegram
        run: python3 .github/scripts/notify_telegram_release.py
