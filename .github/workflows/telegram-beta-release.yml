name: Telegram beta release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published beta tag to announce
        required: true
        type: string
      dry_run:
        description: Build and validate the message without sending it
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: telegram-beta-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  notify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.release.prerelease == true &&
      contains(github.event.release.tag_name, '-beta.'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout notification script
        uses: actions/checkout@v5

      - name: Verify published assets and notify Telegram
        run: python3 .github/scripts/notify_telegram_release.py
