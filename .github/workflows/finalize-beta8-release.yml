name: Finalize Beta 8 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-beta8-release.yml"

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: "379910694"
      BAD_ASSET_ID: "538263051"
      RELEASE_TAG: "v0.3.0-beta.8"
      APK_NAME: "SprutHub.Helper-0.3.0-beta.8.apk"
      CHECKSUM_NAME: "SprutHub.Helper-0.3.0-beta.8.apk.sha256"
      EXPECTED_APK_SHA256: "28081ac5e84c2aa1bede3112ac062750f554c3ca4caab4b911688eb56e0829f6"

    steps:
      - name: Remove accidental asset and verify release
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"

          test "$(gh api "$api/releases/$RELEASE_ID" --jq .tag_name)" = "$RELEASE_TAG"
          test "$(gh api "$api/releases/$RELEASE_ID" --jq .draft)" = "true"

          if gh api "$api/releases/assets/$BAD_ASSET_ID" >/dev/null 2>&1; then
            gh api --method DELETE "$api/releases/assets/$BAD_ASSET_ID"
          fi

          if gh api "$api/releases/assets/$BAD_ASSET_ID" >/dev/null 2>&1; then
            echo "Accidental asset still exists" >&2
            exit 1
          fi

          mapfile -t assets < <(gh api "$api/releases/$RELEASE_ID/assets" --paginate --jq '.[].name' | sort)
          expected=("$APK_NAME" "$CHECKSUM_NAME")
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#assets[@]}" -eq 2
          test "${assets[*]}" = "${expected_sorted[*]}"

          apk_digest="$(gh api "$api/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == env.APK_NAME) | .digest')"
          test "$apk_digest" = "sha256:$EXPECTED_APK_SHA256"

          checksum_id="$(gh api "$api/releases/$RELEASE_ID/assets" --jq '.[] | select(.name == env.CHECKSUM_NAME) | .id')"
          gh api -H "Accept: application/octet-stream" "$api/releases/assets/$checksum_id" > checksum.txt
          grep -Fq "$EXPECTED_APK_SHA256" checksum.txt

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          api="repos/$GITHUB_REPOSITORY"
          gh api --method PATCH "$api/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true \
            -f tag_name="$RELEASE_TAG" \
            -f name="SprutHub Helper 0.3.0 Beta 8" >/dev/null
          test "$(gh api "$api/releases/$RELEASE_ID" --jq .draft)" = "false"
          test "$(gh api "$api/releases/$RELEASE_ID" --jq .prerelease)" = "true"

      - name: Dispatch Telegram announcement
        shell: bash
        run: |
          gh workflow run telegram-beta-release.yml \
            --ref main \
            -f tag="$RELEASE_TAG" \
            -f dry_run=false
